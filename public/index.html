<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>投票监测看板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; min-height: 100vh; }
.container { max-width: 420px; margin: 0 auto; padding: 16px; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px; padding: 20px; color: #fff; margin-bottom: 16px; }
.header h1 { font-size: 20px; margin-bottom: 6px; }
.header .subtitle { font-size: 13px; opacity: 0.85; }
.status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 13px; color: #666; }
.refresh-btn { background: #fff; border: 1px solid #e0e0e0; padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; color: #667eea; }
.refresh-btn:active { background: #f0f0f0; }
.podium { display: flex; justify-content: space-around; align-items: flex-end; margin-bottom: 16px; height: 180px; }
.podium-item { flex: 1; text-align: center; }
.podium-rank { font-size: 28px; font-weight: bold; margin-bottom: 6px; }
.podium-1 .podium-rank { color: #ffd700; }
.podium-2 .podium-rank { color: #c0c0c0; }
.podium-3 .podium-rank { color: #cd7f32; }
.podium-name { font-size: 12px; color: #333; margin-bottom: 4px; line-height: 1.3; min-height: 32px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.podium-votes { font-size: 14px; font-weight: bold; color: #e74c3c; }
.podium-bar { width: 60%; margin: 8px auto 0; border-radius: 8px 8px 0 0; }
.podium-1 .podium-bar { height: 100px; background: linear-gradient(to top, #ffd700, #ffed4e); }
.podium-2 .podium-bar { height: 75px; background: linear-gradient(to top, #c0c0c0, #e8e8e8); }
.podium-3 .podium-bar { height: 55px; background: linear-gradient(to top, #cd7f32, #e8a87c); }
.target-card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border-left: 4px solid #e74c3c; }
.target-card .label { font-size: 13px; color: #999; margin-bottom: 8px; }
.target-card .name { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 10px; }
.target-card .rank { display: inline-block; background: #e74c3c; color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 14px; font-weight: bold; margin-right: 10px; }
.target-card .votes { font-size: 24px; font-weight: bold; color: #e74c3c; }
.gap-list { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.gap-list h3 { font-size: 15px; margin-bottom: 12px; color: #333; }
.gap-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
.gap-item:last-child { border-bottom: none; }
.gap-rank { font-weight: bold; color: #667eea; margin-right: 8px; }
.gap-name { flex: 1; font-size: 14px; color: #333; }
.gap-num { font-size: 14px; font-weight: bold; color: #e74c3c; }
.rank-list { background: #fff; border-radius: 16px; padding: 12px 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.rank-list h3 { font-size: 15px; margin-bottom: 12px; color: #333; }
.rank-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
.rank-row:last-child { border-bottom: none; }
.rank-num { width: 28px; height: 28px; border-radius: 50%; background: #f0f2f5; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; margin-right: 10px; flex-shrink: 0; }
.rank-row.top1 .rank-num { background: #ffd700; color: #fff; }
.rank-row.top2 .rank-num { background: #c0c0c0; color: #fff; }
.rank-row.top3 .rank-num { background: #cd7f32; color: #fff; }
.rank-name { flex: 1; font-size: 14px; color: #333; }
.rank-row.target .rank-name { color: #e74c3c; font-weight: bold; }
.rank-votes { font-size: 14px; font-weight: bold; color: #666; }
.rank-row.target .rank-votes { color: #e74c3c; }
.error { text-align: center; padding: 20px; color: #e74c3c; font-size: 14px; }
.loading { text-align: center; padding: 40px; color: #999; }
.footer { text-align: center; padding: 16px; font-size: 12px; color: #bbb; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🏆 投票监测看板</h1>
    <div class="subtitle">奋斗筑梦 劳动最美 · 专题榜单</div>
  </div>

  <div class="status-bar">
    <span id="status">加载中...</span>
    <button class="refresh-btn" onclick="loadData()">🔄 刷新</button>
  </div>

  <div id="content"></div>

  <div class="footer">数据来源：投票活动页面<br>每 30 分钟自动刷新 · 仅供监测参考</div>
</div>

<script>
const API_BASE = '';
const TARGET_NAME = '长虹新生态百工图';
const Q_PARAM = 'h2oLSH8WH1Gy/ZqKmkHYt122FPFLD9355qtSXCPADu0=';

let token = '';
let countdown = 1800;

async function login() {
  const res = await fetch(API_BASE + '/api/auth/userLogin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ q: Q_PARAM })
  });
  const data = await res.json();
  if (data.success && data.data) {
    token = data.data.token || data.data;
    return true;
  }
  throw new Error(data.message || '登录失败');
}

async function getRank() {
  const res = await fetch(API_BASE + '/api/activity/rank', {
    headers: { 'Authorization': token }
  });
  const data = await res.json();
  if (data.success) return data.data;
  throw new Error(data.message || '获取排行失败');
}

function render(works) {
  const target = works.find(w => w.name === TARGET_NAME);
  const targetIdx = works.findIndex(w => w.name === TARGET_NAME);
  const targetRank = targetIdx + 1;
  const top3 = works.slice(0, 3);

  let html = '';

  // 领奖台
  html += '<div class="podium">';
  const order = [1, 0, 2];
  for (const i of order) {
    const w = top3[i];
    const rank = i + 1;
    html += `<div class="podium-item podium-${rank}">
      <div class="podium-rank">${['🥇','🥈','🥉'][i]}</div>
      <div class="podium-name">${w.name}</div>
      <div class="podium-votes">${w.voteNumber} 票</div>
      <div class="podium-bar"></div>
    </div>`;
  }
  html += '</div>';

  // 关注作品卡片
  if (target) {
    html += `<div class="target-card">
      <div class="label">⭐ 关注作品</div>
      <div class="name">${target.name}</div>
      <div>
        <span class="rank">第 ${targetRank} 名</span>
        <span class="votes">${target.voteNumber} 票</span>
      </div>
    </div>`;

    // 差距分析
    html += '<div class="gap-list"><h3>📊 票数差距分析</h3>';
    if (targetRank <= 3) {
      if (targetRank > 1) {
        const prev = works[targetIdx - 1];
        html += `<div class="gap-item"><span><span class="gap-rank">第${targetRank-1}名</span><span class="gap-name">${prev.name}</span></span><span class="gap-num">落后 ${prev.voteNumber - target.voteNumber} 票</span></div>`;
      }
      if (targetRank < works.length) {
        const next = works[targetIdx + 1];
        html += `<div class="gap-item"><span><span class="gap-rank">第${targetRank+1}名</span><span class="gap-name">${next.name}</span></span><span class="gap-num">领先 ${target.voteNumber - next.voteNumber} 票</span></div>`;
      }
    } else {
      for (let i = 0; i < 3; i++) {
        const w = works[i];
        html += `<div class="gap-item"><span><span class="gap-rank">第${i+1}名</span><span class="gap-name">${w.name}</span></span><span class="gap-num">差 ${w.voteNumber - target.voteNumber} 票</span></div>`;
      }
    }
    html += '</div>';
  }

  // 完整排行榜
  html += '<div class="rank-list"><h3>📋 完整排行榜</h3>';
  works.forEach((w, i) => {
    const rank = i + 1;
    const cls = ['top1','top2','top3'][i] || '';
    const isTarget = w.name === TARGET_NAME ? 'target' : '';
    html += `<div class="rank-row ${cls} ${isTarget}">
      <div class="rank-num">${rank}</div>
      <div class="rank-name">${w.name}</div>
      <div class="rank-votes">${w.voteNumber}</div>
    </div>`;
  });
  html += '</div>';

  document.getElementById('content').innerHTML = html;
}

async function loadData() {
  try {
    document.getElementById('status').textContent = '加载中...';
    await login();
    const works = await getRank();
    render(works);
    const now = new Date();
    document.getElementById('status').textContent = `更新于 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    countdown = 1800;
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="error">获取数据失败：${e.message}</div>`;
  }
}

setInterval(() => {
  countdown--;
  if (countdown <= 0) {
    loadData();
  } else {
    const m = Math.floor(countdown / 60);
    const s = countdown % 60;
    const el = document.getElementById('status');
    if (el && !el.textContent.startsWith('加载')) {
      const time = el.textContent.split('·')[0];
      el.textContent = `${time}·${m}分${s.toString().padStart(2,'0')}秒后刷新`;
    }
  }
}, 1000);

loadData();
</script>
</body>
</html>
